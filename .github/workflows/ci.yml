name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build du site
        run: npm run build -w apps/web

  calc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/openfisca
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python scripts/run_reference.py
