# Collecte d'un programme officiel (test n°1) depuis GitHub Actions, qui a un accès internet ouvert.
# Déclenchée par une modification de spikes/extraction/collect-request.json, ou à la main.
# Le corpus collecté est commité sur la branche qui a déclenché la collecte, pour être relu et annoté.
# Un corpus déjà exploité (data/extractions/<corpus> existe) n'est jamais recollecté : une archive est
# immuable, une nouvelle collecte prend un nouvel identifiant de corpus. Pas de déclenchement sur main.
name: Collecte d'un programme

on:
  push:
    branches-ignore: [main]
    paths: [spikes/extraction/collect-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collecter
        working-directory: spikes/extraction
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          req=collect-request.json
          corpus=$(jq -r .corpus $req)
          args=(--corpus "$corpus" --candidate "$(jq -r .candidate $req)")
          for u in $(jq -r '.start[]' $req); do args+=(--start "$u"); done
          for u in $(jq -r '.include[]' $req); do args+=(--include "$u"); done
          for u in $(jq -r '(.exclude // [])[]' $req); do args+=(--exclude "$u"); done
          delay=$(jq -r '.delayMs // empty' $req); if [ -n "$delay" ]; then args+=(--delay-ms "$delay"); fi
          if [ "$(jq -r .render $req)" = "true" ]; then args+=(--render); fi
          if [ -d "../../data/extractions/$corpus" ]; then
            echo "::error::Le corpus $corpus est déjà exploité : archive immuable, choisir un nouvel identifiant."
            exit 1
          fi
          rm -rf "../../data/archives/$corpus"   # nouvelle collecte complète, sans fichiers périmés
          npm run collect -- "${args[@]}"
          echo "CORPUS=$corpus" >> "$GITHUB_ENV"
      # Un candidat qui entre dans l'outil reçoit son badge de forme, tiré au sort une fois pour toutes.
      - name: Tirer au sort les badges manquants
        run: npm run tirer-badges -w apps/web
      - name: Commiter le corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A "data/archives/$CORPUS" data/badges.json
          git commit -m "Collecte du corpus $CORPUS" || echo "Aucun changement"
          # La branche a pu avancer pendant la collecte : on rejoue le commit par-dessus.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
