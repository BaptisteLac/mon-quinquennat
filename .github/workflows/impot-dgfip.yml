# Impôt sur le revenu calculé par le code officiel de la DGFiP (sources M publiées sur
# gitlab.adullact.net/dgfip/ir-calcul, copie de Software Heritage), interprété par Mlang
# (github.com/MLanguage/mlang), sur la dernière année de revenus publiée.
# Sert de référence au calcul OpenFisca (test n°2) : les profils de référence sont exportés en
# déclarations de cette année-là. Déclenché par spikes/impot-dgfip/request.json (hors main) ou à la main. Les résultats sont
# commités sur la branche qui a déclenché le run.
name: Impôt DGFiP

on:
  push:
    branches-ignore: [main]
    paths: [spikes/impot-dgfip/request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: impot-dgfip-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  # Version de Mlang : elle fixe aussi la version des sources M (sous-module ir-calcul).
  MLANG_REF: 66f6b37308c0dfeb3bb24c8af7952a522452a1af
  # Années de revenus que cette version de Mlang sait exécuter (dossiers m_ext/).
  MLANG_YEARS: "2018,2019,2020,2021,2022,2023,2024,2025"

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MLanguage/mlang
          ref: ${{ env.MLANG_REF }}
          path: mlang
      - name: Sources M de la DGFiP (Software Heritage)
        id: sources
        run: |
          # gitlab.adullact.net ne répond pas depuis GitHub Actions : copie archivée par Software Heritage.
          python3 spikes/impot-dgfip/swh_fetch.py mlang/ir-calcul "$MLANG_YEARS" > sources.json
          cat sources.json
          echo "year=$(python3 -c 'import json;print(json.load(open("sources.json"))["annee"])')" >> "$GITHUB_OUTPUT"
          echo "dir=$(python3 -c 'import json;print(json.load(open("sources.json"))["dossier"])')" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Déclarations des profils de référence (OpenFisca)
        working-directory: spikes/openfisca
        run: |
          uv sync --frozen
          uv run python scripts/export_irj.py "${{ steps.sources.outputs.year }}"
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y m4 perl python3 clang git build-essential lzip libgmp-dev libmpfr-dev
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.13.1
      - name: Dépendances OCaml
        working-directory: mlang
        run: opam install . --deps-only -y
      - name: Compiler Mlang
        working-directory: mlang
        run: opam exec -- make build
      - name: Calculer l'impôt des déclarations
        working-directory: mlang
        env:
          YEAR: ${{ steps.sources.outputs.year }}
          SRC: ir-calcul/${{ steps.sources.outputs.dir }}
        run: |
          out="$GITHUB_WORKSPACE/spikes/impot-dgfip/resultats"
          rm -rf "$out" && mkdir -p "$out"
          {
            echo "mlang $MLANG_REF"
            python3 -c 'import json;d=json.load(open("../sources.json"));print("ir-calcul", d["revision"] + ", dossier", d["dossier"], "(archive.softwareheritage.org, visite du", d["visite"] + ")")'
            echo "revenus $YEAR"
          } > "$out/versions.txt"
          # Même ordre que la fonction source_dir_sans_cibles_m des Makefile de Mlang.
          # Sur une seule ligne : un retour à la ligne couperait la commande dans la recette make.
          files="$(find "$SRC" -name tgvI.m) $(find "$SRC" -name errI.m) $(find "$SRC" -name '*.m' ! -name 'err*.m' ! -name 'tgv*.m' ! -name cibles.m | sort | tr '\n' ' ')"
          for f in "$GITHUB_WORKSPACE"/spikes/impot-dgfip/cas/*.irj; do
            name=$(basename "$f" .irj)
            opam exec -- make YEAR="$YEAR" SOURCE_FILES="$files" TEST_FILE="$f" test_file > "$out/$name.log" 2>&1 || true
          done
          # Définition des cases saisies et des montants restitués, pour vérifier les codes.
          codes=$(cat "$GITHUB_WORKSPACE"/spikes/impot-dgfip/cas/*.irj | grep -E '^[A-Z0-9_]+/' | cut -d/ -f1 | sort -u)
          for c in $codes; do
            grep -hE "^(V_)?$c *:|alias $c *:" "$SRC/tgvI.m" >> "$out/variables.txt" || echo "$c : introuvable" >> "$out/variables.txt"
          done
      - name: Comparer à OpenFisca
        working-directory: spikes/openfisca
        run: uv run python scripts/compare_dgfip.py
      - name: Commiter les résultats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in spikes/impot-dgfip/resultats spikes/impot-dgfip/cas; do
            if [ -d "$d" ]; then git add -f -A "$d"; fi
          done
          git commit -m "Impôt DGFiP : résultats du run ${{ github.run_id }}" || echo "Aucun changement"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
