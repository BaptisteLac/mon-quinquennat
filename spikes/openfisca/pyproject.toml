[project]
name = "mq-openfisca-spike"
version = "0.0.0"
description = "Test de faisabilité n°2 : calcul des montants d'un profil avec OpenFisca-France"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openfisca-france==176.1.3",
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
