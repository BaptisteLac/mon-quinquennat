# Programmes officiels suivis par la veille.
# Règle : uniquement des pages et documents publiés par le candidat ou sa campagne.
# Ne jamais remplir une URL de mémoire : copier l'adresse depuis le site officiel.
#
# Un programme est un corpus : les pages web du site officiel sous les préfixes déclarés,
# plus les PDF du même site liés depuis ces pages. Rien d'autre n'est collecté.
#
# Exemple de structure (à dupliquer par candidat) :
#
# - candidateId: c-01
#   displayName: "Prénom Nom"
#   party: "Nom complet du parti"
#   status: declaree        # declaree | officielle | retire
#   programme:
#     start:                # pages d'entrée (ex. « Notre programme »)
#       - "https://…"
#     include:              # préfixes d'URL suivis ; par défaut, les pages d'entrée
#       - "https://…"
#     render: false         # true si le contenu n'apparaît qu'avec JavaScript
#     watch: weekly         # passe en daily 6 semaines avant le 1er tour
#     volatile:             # expressions régulières retirées avant comparaison par la veille :
#       - "…"               # ce qui change sans que le programme change (compteurs, dates de mise à jour)

candidates:
  - candidateId: c-01
    displayName: "David Lisnard"
    party: "Nouvelle Énergie"
    status: declaree
    corpusPrefix: nouvelle-energie
    programme:
      start:
        - "https://www.unenouvelleenergie.fr/notre-programme/"
        - "https://www.unenouvelleenergie.fr/questions/"
      include:
        - "https://www.unenouvelleenergie.fr/notre-programme/"
        - "https://www.unenouvelleenergie.fr/questions/"
        - "https://nouvelle-energie-media-prod.s3.fr-par.scw.cloud/media/"
      render: true
      watch: weekly
      volatile:
        - "\\d[\\d\\s]* adhérents( au \\d{1,2}(er)? \\p{L}+ \\d{4})?"
        - "Mis à jour le \\d{1,2}(er)? \\p{L}+ \\d{4}"
        - "Prochains rendez-vous : .*"
        - "(registre des adhésions|base des contacts) de Nouvelle Énergie, \\d{1,2}(er)? \\p{L}+ \\d{4}"
        - pattern: "^\\d[\\d\\s]*$"
          url: "https://www.unenouvelleenergie.fr/questions/combien-d-adherents-compte-nouvelle-energie/"
        - pattern: "\\d[\\d\\s]* élus"
          url: "https://www.unenouvelleenergie.fr/questions/combien-d-adherents-compte-nouvelle-energie/"
  - candidateId: c-02
    displayName: "Jean-Luc Mélenchon"
    party: "La France insoumise"
    status: declaree
    corpusPrefix: france-insoumise
    # Le site annonce « L'Avenir en commun est en cours de réactualisation » ; nouvelle version
    # présentée les 6 et 7 novembre 2026. La veille détecte sa publication ; l'extraction attend
    # cette version (les chapitres 2025 encore en ligne sont archivés, pas extraits).
    programme:
      start:
        - "https://melenchon2027.fr/programme/decouvrir/"
        - "https://melenchon2027.fr/programme/plans-thematiques/"
        - "https://melenchon2027.fr/programme/plans-investissement/"
        - "https://melenchon2027.fr/programme2025/livre/"
      include:
        - "https://melenchon2027.fr/programme/"
        - "https://melenchon2027.fr/programme2025/livre/"
        # PDF de campagne d'octobre 2026 (« Comment nous allons remettre de l'ordre dans les
        # comptes publics ») ; pas le programme du Nouveau Front populaire de 2024, lié depuis le menu.
        - "https://melenchon2027.fr/wp-content/uploads/2026/10/"
      render: true
      watch: weekly
      volatile: []
