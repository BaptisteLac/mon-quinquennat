# Programmes officiels suivis par la veille.
# Règle : uniquement des pages et documents publiés par le candidat ou sa campagne.
# Ne jamais remplir une URL de mémoire : copier l'adresse depuis le site officiel.
#
# Un programme est un corpus : les pages web du site officiel sous les préfixes déclarés,
# plus les PDF du même site liés depuis ces pages. Rien d'autre n'est collecté.
#
# Exemple de structure (à dupliquer par candidat) :
#
# - candidateId: c-01
#   displayName: "Prénom Nom"
#   party: "Nom complet du parti"
#   status: declaree        # declaree | officielle | retire
#   programme:
#     start:                # pages d'entrée (ex. « Notre programme »)
#       - "https://…"
#     include:              # préfixes d'URL suivis ; par défaut, les pages d'entrée
#       - "https://…"
#     exclude:              # préfixes jamais collectés (ex. document d'une autre élection)
#       - "https://…"
#     render: false         # true si le contenu n'apparaît qu'avec JavaScript
#     watch: weekly         # passe en daily 6 semaines avant le 1er tour
#     volatile:             # expressions régulières retirées avant comparaison par la veille :
#       - "…"               # ce qui change sans que le programme change (compteurs, dates de mise à jour)

candidates:
  - candidateId: c-01
    displayName: "David Lisnard"
    party: "Nouvelle Énergie"
    status: declaree
    corpusPrefix: nouvelle-energie
    programme:
      start:
        - "https://www.unenouvelleenergie.fr/notre-programme/"
        - "https://www.unenouvelleenergie.fr/questions/"
      include:
        - "https://www.unenouvelleenergie.fr/notre-programme/"
        - "https://www.unenouvelleenergie.fr/questions/"
        - "https://nouvelle-energie-media-prod.s3.fr-par.scw.cloud/media/"
      render: true
      watch: weekly
      volatile:
        - "\\d[\\d\\s]* adhérents( au \\d{1,2}(er)? \\p{L}+ \\d{4})?"
        - "Mis à jour le \\d{1,2}(er)? \\p{L}+ \\d{4}"
        - "Prochains rendez-vous : .*"
        - "(registre des adhésions|base des contacts) de Nouvelle Énergie, \\d{1,2}(er)? \\p{L}+ \\d{4}"
        - pattern: "^\\d[\\d\\s]*$"
          url: "https://www.unenouvelleenergie.fr/questions/combien-d-adherents-compte-nouvelle-energie/"
        - pattern: "\\d[\\d\\s]* élus"
          url: "https://www.unenouvelleenergie.fr/questions/combien-d-adherents-compte-nouvelle-energie/"
  - candidateId: c-02
    displayName: "Jean-Luc Mélenchon"
    party: "La France insoumise"
    status: declaree
    corpusPrefix: france-insoumise
    # 5e édition de L'Avenir en commun, « le programme de la Nouvelle France » (1 069 mesures), en
    # librairie le 6 novembre 2026 et en ligne chapitre par chapitre depuis la mi-novembre. Les plans
    # thématiques et d'investissement, présentés comme des compléments, ne sont pas collectés ici.
    programme:
      start:
        - "https://melenchon2027.fr/programme/livre/"
      include:
        - "https://melenchon2027.fr/programme/livre/"
      exclude:
        # PDF lié depuis le livre : contrat de législature du Nouveau Front populaire (législatives 2024).
        - "https://melenchon2027.fr/wp-content/"
      render: true
      delayMs: 5000         # le site renvoie des 403 (protection anti-robots) quand on enchaîne les pages
      watch: weekly
      volatile: []
  - candidateId: c-03
    displayName: "Bruno Retailleau"
    party: "Les Républicains"
    status: declaree
    corpusPrefix: les-republicains
    # « Mon projet pour la France » : une page par thème et par mesure (recensement du 2026-10-29).
    programme:
      start:
        - "https://www.avecretailleau.fr/projet"
      include:
        - "https://www.avecretailleau.fr/projet"
      render: true
      watch: weekly
      volatile: []
  - candidateId: c-04
    displayName: "Édouard Philippe"
    party: "Horizons"
    status: declaree
    corpusPrefix: horizons
    # Site refondu en novembre 2026 : les quatre pages « priorités » ont été remplacées par
    # « Le programme » et ses 17 thématiques (propositions phares et questions-réponses).
    # Le « livret du programme, volume 1 » ne se télécharge qu'en laissant ses coordonnées : non collecté.
    programme:
      start:
        - "https://www.edouardphilippe.fr/programme"
      include:
        - "https://www.edouardphilippe.fr/programme"
      render: true
      watch: weekly
      volatile: []
  - candidateId: c-05
    displayName: "Raphaël Glucksmann"
    party: "Place publique"
    status: declaree
    corpusPrefix: place-publique
    # Six axes et leurs orientations ; « le détail des mesures et leur chiffrage seront publiés
    # progressivement » (recensement du 2026-10-29, vérifié le 2026-11-03).
    programme:
      start:
        - "https://raphaelglucksmann.eu/programme.html"
      include:
        - "https://raphaelglucksmann.eu/programme.html"
      render: true
      watch: weekly
      volatile: []
