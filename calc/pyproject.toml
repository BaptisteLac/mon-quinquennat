[project]
name = "mq-calc"
version = "0.0.0"
description = "Service de calcul : montants d'un profil avec OpenFisca-France, législation actuelle et réformes des candidats"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openfisca-france==176.1.3",
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
